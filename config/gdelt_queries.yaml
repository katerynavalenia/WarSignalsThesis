# Phase 3 — GDELT multilingual keyword dictionary
# =================================================
#
# Used as a loose filter before downloading articles from GDELT DOC 2.0.
# Each query is a logical OR over its keyword groups. Multiple queries
# are combined with logical AND at extraction time.
#
# Date range: 2022-09-29 → 2026-06-21 (matches attack data)
#
# **Important constraint:** GDELT 2.0 has a URL length limit. Keep each
# query under ~50 keywords total (English + native). Long OR lists
# match almost nothing.
#
# Languages: see GDELT's language codes
#   English, Russian, Ukrainian, German, French, Polish

queries:

  # Query 1: Russian attack on Ukraine — direct coverage
  - name: russian_attack_direct
    description: >
      Articles directly referencing the Russian-Ukrainian conflict, with
      country+weapon context. SHORT keyword list for URL length limits.
    languages: [English, Russian, Ukrainian]
    themes: []
    keywords_any:
      english:    [Russia, Russian, Kremlin, Putin, Ukraine, Ukrainian, Kyiv, Zelensky]
      russian:    [Россия, России, Кремль, Путин, Украина, Киев]
      ukrainian:  [Росія, Росії, Кремль, Путін, Україна, Київ]
    keywords_weapon_any:
      english:    [missile, drone, Shahed, Iskander, airstrike, attack, explosion]
      russian:    [ракета, дрон, Шахед, Искандер, удар, взрыв]
      ukrainian:  [ракета, дрон, Шахед, Іскандер, удар, вибух]

  # Query 2: Ukrainian defense / air defense / energy strikes
  - name: ukraine_defense_energy
    description: >
      Coverage of Ukrainian air defense, energy infrastructure, and
      defense-related topics.
    languages: [English, Ukrainian]
    themes: []
    keywords_any:
      english:    ["air defense", "energy infrastructure", "power grid", "blackout",
                   Patriot, "F-16", HIMARS, "military aid"]
      ukrainian:  [ППО, Patriot, F-16]
    keywords_weapon_any: {}

  # Query 3: Defense industry / military spending
  - name: defense_industry_western
    description: >
      Western defense industry, military spending, and arms transfers.
    languages: [English, German, French]
    themes: []
    keywords_any:
      english:    [Lockheed, Raytheon, RTX, Boeing, Rheinmetall, BAE, Saab,
                   "defense stock", rearmament, NATO, "military spending"]
      german:     [Rüstung, Rheinmetall, Verteidigung, NATO]
      french:     [défense, Thales, Safran, Airbus, OTAN, réarmement]
    keywords_weapon_any: {}

  # Query 4: Energy markets (only insofar as war-related)
  - name: energy_war
    description: >
      Energy market news tied to the conflict (gas, oil, sanctions).
    languages: [English, German, French]
    themes: []
    keywords_any:
      english:    [Brent, "oil price", "natural gas", "Nord Stream", Gazprom,
                   "Russian oil", "oil embargo", "price cap"]
      german:     [Ölpreis, Erdgas, Gazprom, Ölembargo]
      french:     [pétrole, gaz, embargo]
    keywords_weapon_any: {}

# Default language list
default_languages: [English, Russian, Ukrainian]

# Output config
output:
  # How many records per API call (max 250 per GDELT)
  max_records_per_call: 250
  # Sleep between API calls (seconds) — GDELT public API: 1 per 5s
  api_sleep_seconds: 5.0
  # Max retries per call
  max_retries: 5
  # Backoff factor (seconds)
  retry_backoff: 2.0

# Dedup config
dedup:
  # MinHash signature size
  num_perm: 128
  # Shingle (n-gram) size for titles
  shingle_size: 5
  # Jaccard threshold for "duplicate"
  threshold: 0.7
  # Min title length (in chars) to attempt dedup
  min_title_len: 20
