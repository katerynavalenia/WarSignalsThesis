# Phase 3 — GDELT multilingual keyword dictionary
# =================================================
#
# Used as a loose filter before downloading articles from GDELT DOC 2.0.
# Each query is a logical OR over its keyword groups. Multiple queries
# are combined with logical AND at extraction time.
#
# Date range: 2022-09-29 → 2026-06-21 (matches attack data)
#
# Languages: see GDELT's language codes
#   English, Russian, Ukrainian, German, French, Polish, Spanish, Italian
#
# Themes: GDELT GNS/GKG theme codes (use sparingly — too restrictive kills recall)

queries:

  # Query 1: Russian attack on Ukraine — direct coverage
  - name: russian_attack_direct
    description: >
      Articles directly referencing the Russian-Ukrainian conflict, with
      strong country+weapon context. Used as the primary filter.
    languages: [English, Russian, Ukrainian, German, French, Polish]
    themes: []
    keywords_any:  # country / actor keywords
      english:    [Russia, Russian, Kremlin, Putin, Ukraine, Ukrainian, Kyiv, Kiev, Zelensky, Zelenskyy, "Volodymyr"]
      russian:    [Россия, России, Кремль, Путин, Украина, Украины, Киев, Зеленский]
      ukrainian:  [Росія, Росії, Кремль, Путін, Україна, України, Київ, Зеленський]
      german:     [Russland, russisch, Kreml, Putin, Ukraine, ukrainisch, Kiew, Selenskyj]
      french:     [Russie, russe, Kremlin, Poutine, Ukraine, ukrainien, Kiev, Zelensky]
      polish:     [Rosja, rosyjski, Kreml, Putin, Ukraina, ukraiński, Kijów, Zełenski]
    keywords_weapon_any:  # weapon / attack keywords
      english:    [missile, missiles, drone, drones, airstrike, airstrikes, "air strike", "air strikes",
                   Shahed, Kalibr, Iskander, Kinzhal, Lancet, "Kh-101", "S-300", "S-400",
                   ballistic, cruise, explosion, explosions, attack, attacks, missile strike,
                   drone strike, drone attack, missile attack, bombed, bombing, struck, fired]
      russian:    [ракета, ракеты, дрон, БПЛА, удар, удары, взрыв, взрывы, атака, нападение,
                   "Шахед", Калибр, Искандер, Кинжал, Lancet, "С-300", "С-400", баллистическая]
      ukrainian:  [ракета, ракети, дрон, БпЛА, удар, удари, вибух, вибухи, атака, напад,
                   "Шахед", Калібр, Іскандер, Кинджал, Lancet, "С-300", "С-400", балістична]
      german:     [Rakete, Raketen, Drohne, Angriff, Explosion, Shahed, Kalibr, Iskander]
      french:     [missile, drone, attaque, explosion, frappe, Shahed, Kalibr, Iskander]
      polish:     [rakieta, dron, atak, eksplozja, Shahed, Kalibr, Iskander]

  # Query 2: Ukrainian defense / air defense / energy strikes
  - name: ukraine_defense_energy
    description: >
      Coverage of Ukrainian air defense, energy infrastructure, and
      defense-related topics. Catches articles that don't mention weapons
      directly.
    languages: [English, Ukrainian, German]
    themes: []
    keywords_any:
      english:    ["air defense", "air-defense", "air defence", "air-defence",
                   "energy infrastructure", "power grid", "blackout", "electricity",
                   "thermal power", "hydroelectric", "substation", "transformer",
                   "debris", "downed", "intercepted", "shoot down", "shot down",
                   "Patriot", "NASAMS", "Iris-T", "Gepard", "Stinger", "Javelin",
                   "HIMARS", "M270", "Leopard", "Abrams", "F-16", "fighter jet",
                   "military aid", "defense aid", "security assistance"]
      ukrainian:  [ППО, "повітряна оборона", "енергетична інфраструктура",
                   "енергооб'єкт", "підстанція", "уламки", "збито", "збитий",
                   "Patriot", "F-16", "військова допомога"]
      german:     [Luftverteidigung, Patriot, Iris-T, F-16, Militärhilfe]

  # Query 3: Defense industry / military spending
  - name: defense_industry_western
    description: >
      Western defense industry, military spending, and arms transfers.
      Captures the financial-market angle of the conflict.
    languages: [English, German, French]
    themes: []
    keywords_any:
      english:    [Lockheed, Martin, Raytheon, RTX, Boeing, Northrop, Grumman, General Dynamics,
                   BAE, Systems, Rheinmetall, Hensoldt, Thales, Leonardo, Saab, Kongsberg,
                   Renk, "defense stock", "defense sector", "defense industry",
                   "military spending", "defense spending", "arms sales", "arms export",
                   "weapons sale", "weapons export", rearmament, rearm, rearming,
                   "ammunition production", "shell production", "tank production",
                   Pentagon, NATO, "European Defence Fund", EDIS, EDIP,
                   PESCO, "Article 5", "defense budget", "defense contract"]
      german:     [Rüstung, Rüstungsindustrie, Rüstungskonzern, Verteidigung, Bundeswehr,
                   Rheinmetall, Hensoldt, Renk, "Rüstungsausgaben", "Verteidigungsausgaben",
                   "Waffenlieferung", "Waffenexport", Wiederbewaffnung, Aufrüstung,
                   NATO, Bundeswehr]
      french:     [défense, armement, armements, "industrie de défense", Thales, Dassault,
                   Safran, Airbus, "budget de la défense", "dépenses militaires",
                   "vente d'armes", réarmement, OTAN, "industrie de l'armement"]

  # Query 4: Energy markets (only insofar as war-related)
  - name: energy_war
    description: >
      Energy market news tied to the conflict (e.g., gas storage, oil
      sanctions, infrastructure strikes). Subset of war-driven energy news.
    languages: [English, German, French]
    themes: []
    keywords_any:
      english:    [Brent, WTI, "oil price", "natural gas", "Nord Stream", Nordstream,
                   Gazprom, "OPEC+", "Russian oil", "Russian gas", "oil embargo",
                   "oil sanction", "price cap", "G7 cap", "EU embargo",
                   "strategic petroleum reserve"]
      german:     [Ölpreis, Erdgas, "Nord Stream", Gazprom, "russisches Öl",
                   Ölembargo, Preisdeckel]
      french:     [pétrole, gaz, "Nord Stream", Gazprom, embargo, "prix du baril"]

# Default language list (used when language-specific filter is not critical)
default_languages: [English, Russian, Ukrainian, German, French, Polish]

# Output config
output:
  # How many records per API call (max 250 per GDELT)
  max_records_per_call: 250
  # Sleep between API calls (seconds) — GDELT public API: 1 per 5s
  api_sleep_seconds: 5.0
  # Max retries per call
  max_retries: 5
  # Backoff factor (seconds)
  retry_backoff: 2.0

# Dedup config
dedup:
  # MinHash signature size
  num_perm: 128
  # Shingle (n-gram) size for titles
  shingle_size: 5
  # Jaccard threshold for "duplicate"
  threshold: 0.7
  # Min title length (in chars) to attempt dedup
  min_title_len: 20
