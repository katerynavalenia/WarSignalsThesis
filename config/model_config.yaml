# Model configuration
# Phase 6 — ACTIVE. Drives scripts/phase6_run_baselines.py.

# Forecast horizons (in trading days)
horizons:
  primary: 1
  secondary: 5
  optional_volatility: 20

# Out-of-sample design
validation:
  method: "expanding_window"
  initial_train_start: "2020-01-01"    # financial warm-up
  test_fraction: 0.25                  # reserve final 25-30% for test
  min_train_observations: 500
  refit_frequency: 20                  # refit every 20 trading days
  quick_refit_frequency: 5             # smoke-test cadence
  quick_n_days: 60                     # smoke-test window

# Information sets (horse race)
information_sets:
  F: "financial baseline"
  P: "financial + physical attacks"
  N: "financial + news"
  PN: "financial + physical + news"
  PNG: "financial + physical + news + narrative gaps"

# Econometric benchmarks
baselines:
  returns:
    - name: "historical_mean"
      module: "src.models.baselines.HistoricalMeanForecaster"
    - name: "ar1"
      module: "src.models.baselines.AR1Forecaster"
      lags: 1
    - name: "ols"
      module: "src.models.baselines.LinearRegressionForecaster"
      fit_intercept: true
    - name: "ridge"
      module: "src.models.baselines.RidgeForecaster"
      alpha: 1.0
      fit_intercept: true
  volatility:
    - name: "garch"
      module: "src.models.garch.GARCHForecaster"
      variant: "GARCH"
      p: 1
      q: 1
      dist: "t"          # Student-t for fatter tails
      rescale: true
      mean: "Zero"
    - name: "gjr_garch"
      module: "src.models.garch.GARCHForecaster"
      variant: "GJR_GARCH"
      p: 1
      q: 1
      dist: "t"
      rescale: true
      mean: "Zero"
    - name: "egarch"
      module: "src.models.garch.GARCHForecaster"
      variant: "EGARCH"
      p: 1
      q: 1
      dist: "t"
      rescale: true
      mean: "Zero"

# Machine learning (Phase 7) — XGBoost principal algorithm (decision_log 2026-07-01)
ml:
  algorithm: "xgboost"      # XGBoost over LightGBM (decision_log 2026-07-01)
  objective: "reg:squarederror"  # point forecast of return (continuous)
  eval_metric: "mae"        # early stopping on MAE (matches Phase 6 metric)
  random_seed: 42

  # Hyperparameters used when TS-CV tuning is skipped (--no-tune).
  # These are the Master Plan §10.4 conservative defaults.
  defaults:
    max_depth: 5            # shallow trees (Master Plan §10.4)
    learning_rate: 0.05     # conservative
    n_estimators: 500       # with early stopping
    min_child_weight: 5     # regularization
    reg_alpha: 0.0          # L1 regularization (default off)
    reg_lambda: 1.0         # L2 regularization
    subsample: 0.8          # row subsampling
    colsample_bytree: 0.8   # column subsampling
    early_stopping_rounds: 50
    val_fraction: 0.15      # tail of train used as validation for early stopping

  # Time-series CV grid search tuning (Phase 7.3)
  tuning:
    param_grid:
      max_depth: [3, 5]
      learning_rate: [0.03, 0.05, 0.1]
      n_estimators: [200, 500, 1000]
      min_child_weight: [5, 20]
      reg_alpha: [0.0, 0.1]
      reg_lambda: [1.0, 5.0]
    n_splits: 3             # expanding-window CV folds inside training data
    embargo: 5              # trading-day gap between train and val (no look-ahead)
    min_train_size: 200
    # NOTE: 3*3*3*2*2*2 = 216 configs × 3 folds = 648 fits per
    # (info_set, horizon); 5 info sets × 2 horizons = 6,480 fits total.
    # On Colab Pro CPU: ~110 min. On local CPU: ~4-6 hours.

  # SHAP (Phase 7.6) — feature attribution
  shap:
    max_evals: 500           # cap SHAP evaluations per fold (safety)
    background_size: 50      # background dataset size for TreeExplainer
    top_k: 10                # top-K features for the stability report

# GARCH-X (Phase 7.5) — exogenous regressors in GARCH mean equation
garch_x:
  enabled: true              # decision_log 2026-07-01: GARCH-X included in Phase 7
  mean: "ARX"               # exogenous regressors in the mean equation
  exog_info_set: "F"        # which info set to use as exog (F = financial baseline;
                            #   could be "P" for attacks, "PN" for combined, etc.)
                            #   One GARCH-X spec per variant × target × horizon.
  # The arch package does not natively support h-step exog forecasts, so for
  # h > 1 we use recursive 1-step forecasts (mirrors the C4 EGARCH fix from
  # Phase 6). Falls back to a two-step ARX-residual + univariate GARCH if
  # the arch package refuses the ARX + chosen vol model combination.

# Evaluation metrics
metrics:
  returns:
    - "MAE"
    - "RMSE"
    - "directional_accuracy"
    - "correlation"
  volatility:
    - "QLIKE"
    - "MAE"
    - "MSE"
    - "bias"

# Statistical comparison (Phase 8)
comparison:
  - "diebold_mariano"
  - "clark_west"
  - "model_confidence_set"

# Targets
targets:
  primary: "r_ITA"
  secondary: "r_WAERLST_recon"

# Seeds
seeds:
  global: 42
